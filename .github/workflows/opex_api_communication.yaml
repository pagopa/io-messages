name: Opex Dashboard api_communication

on:
  push:
    branches:
      - main
    paths:
      - "openapi/generated/api_communication.yaml"
      - ".opex/api_communication/**"
      - ".github/workflows/opex_api_communication.yaml"
      - ".github/workflows/call_opex_api.yaml"
  workflow_dispatch:

concurrency:
  group: opex-api-communication-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply changes to Production
    uses: ./.github/workflows/call_opex_api.yaml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      api_name: api_communication
      apply: true
