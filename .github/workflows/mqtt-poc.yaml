name: MQTT PoC
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mqtt-poc/**"
      - "compose.yml"
      - "pnpm-lock.yaml"
      - ".github/workflows/mqtt-poc.yaml"
permissions:
  contents: read
jobs:
  local-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter mqtt-poc typecheck && pnpm --filter mqtt-poc lint:check && pnpm --filter mqtt-poc test
      - run: pnpm --filter mqtt-poc run setup && pnpm --filter mqtt-poc local:up
      - run: pnpm --filter mqtt-poc test:integration && pnpm --filter mqtt-poc test:reliability && pnpm --filter mqtt-poc test:dx
      - run: pnpm --filter mqtt-poc test:services --services 6 --creates-per-service 2 --online-window 3 --batch-size 3
      - run: pnpm --filter mqtt-poc local:stop
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mqtt-poc-test-evidence
          path: apps/mqtt-poc/results/*.json
