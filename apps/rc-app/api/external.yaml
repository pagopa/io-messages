openapi: 3.0.3
info:
  version: 2.0.11
  title: IO Messages Sending - External - API
  x-logo:
    url: https://io.italia.it/assets/img/io-logo-blue.svg
  description: IO Messages Sending - External - API

security:
  - SubscriptionKey: []

paths:
  /api/rc-configurations/{configurationId}:
    get:
      operationId: getRCConfiguration
      summary: Get the remote-content configuration identified by the configurationId
      description: >-
        Get the remote-content configuration using the provided configurationId
        passed as path param
      parameters:
        - in: path
          name: configurationId
          required: true
          description: Ulid string.
          schema:
            type: string
            format: Ulid
            x-import: "@pagopa/ts-commons/lib/strings"
      responses:
        "200":
          description: Return the configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RCConfigurationResponse"
              examples:
                text/json:
                  value: |
                    "configuration_id": "01ARZ3NDEKTSV4RRFFQ69G5FAV",
                    "name": "Configuration name",
                    "description": "Configuration description",
                    "has_precondition": "NONE",
                    "disable_lollipop_for": [
                      "DIXDPZ44E08F367A"
                    ],
                    "is_lollipop_enabled": false,
                    "test_environment": {
                      "base_url": "string",
                      "details_authentication": {
                        "header_key_name": "string",
                        "key": "string",
                        "type": "API-KEY"
                      },
                      "test_users": [
                        "DIXDPZ44E08F367A"
                      ]
                    },
                    "prod_environment": {
                      "base_url": "string",
                      "details_authentication": {
                        "header_key_name": "string",
                        "key": "string",
                        "type": "API-KEY",
                      }
                    }
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
        "403":
          description: Request not authorized.
        "404":
          description: Resource not found.
        "429":
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
        "500":
          description: There was an error trying to get the configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"

    put:
      operationId: updateRCConfiguration
      summary: Update an existing remote-content configuration
      description: >-
        Update the remote-content configuration identified by the provided
        configurationId using the provided payload.
      parameters:
        - in: path
          name: configurationId
          required: true
          description: Ulid string.
          schema:
            type: string
            format: Ulid
            x-import: "@pagopa/ts-commons/lib/strings"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRCConfigurationPublic"
            examples:
              text/json:
                value:
                  name: Descriptive configuration name
                  description: Configuration description
                  has_precondition: NEVER
                  disable_lollipop_for:
                    - DIXDPZ44E08F367A
                  is_lollipop_enabled: false
                  test_environment:
                    base_url: string
                    details_authentication:
                      header_key_name: string
                      key: string
                      type: API-KEY
                    test_users:
                      - DIXDPZ44E08F367A
                  prod_environment:
                    base_url: string
                    details_authentication:
                      header_key_name: string
                      key: string
                      type: API-KEY
      responses:
        "204":
          description: Configuration updated.
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
        "403":
          description: Request not authorized.
        "404":
          description: Resource not found.
        "429":
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
        "500":
          description: There was an error updating the configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"

components:
  securitySchemes:
    SubscriptionKey:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
      description: The API key obtained through the developer portal.

  schemas:
    RCConfigurationPublic:
      allOf:
        - $ref: "#/components/schemas/RCConfigurationBase"
        - $ref: "#/components/schemas/RCConfigurationEnvironment"
    NewRCConfigurationPublic:
      allOf:
        - $ref: "#/components/schemas/NewRCConfigurationBase"
        - $ref: "#/components/schemas/RCConfigurationEnvironment"
    NewRCConfigurationBase:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Configuration name.
        description:
          type: string
          minLength: 1
          description: Configuration description.
        has_precondition:
          $ref: "#/components/schemas/HasPrecondition"
        disable_lollipop_for:
          type: array
          items:
            type: string
            description: User's fiscal code.
            format: FiscalCode
            x-import: "@pagopa/ts-commons/lib/strings"
            example: SPNDNL80R13C555X
        is_lollipop_enabled:
          type: boolean
          description: Flag to check if lollipop is enabled
      required:
        - name
        - description
        - has_precondition
        - disable_lollipop_for
        - is_lollipop_enabled
    RCConfigurationBase:
      allOf:
        - $ref: "#/components/schemas/NewRCConfigurationBase"
        - type: object
          properties:
            configuration_id:
              type: string
              description: Ulid string.
              format: Ulid
              x-import: "@pagopa/ts-commons/lib/strings"
              example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
          required:
            - configuration_id
    RCConfigurationEnvironment:
      type: object
      properties:
        test_environment:
          $ref: "#/components/schemas/RCConfigurationTestEnvironment"
        prod_environment:
          $ref: "#/components/schemas/RCConfigurationProdEnvironment"
    RCConfigurationProdEnvironment:
      type: object
      properties:
        base_url:
          type: string
          minLength: 1
          description: Base url of the server.
        details_authentication:
          $ref: "#/components/schemas/RCAuthenticationConfig"
      required:
        - base_url
        - details_authentication
    RCAuthenticationConfig:
      type: object
      properties:
        header_key_name:
          type: string
          minLength: 1
          description: header key name
        key:
          type: string
          minLength: 1
          description: authentication config key
        type:
          type: string
          minLength: 1
          description: authentication config type
        cert:
          $ref: "#/components/schemas/RCClientCert"
      required:
        - header_key_name
        - key
        - type
    RCClientCert:
      type: object
      properties:
        client_cert:
          type: string
          minLength: 1
          description: authentication config client cert
        client_key:
          type: string
          minLength: 1
          description: authentication config client key
        server_ca:
          type: string
          minLength: 1
          description: authentication config server ca
      required:
        - client_cert
        - client_key
        - server_ca
    RCConfigurationTestEnvironment:
      allOf:
        - $ref: "#/components/schemas/RCConfigurationProdEnvironment"
        - type: object
          properties:
            test_users:
              type: array
              items:
                $ref: "#/components/schemas/FiscalCode"
          required:
            - test_users
    HasPrecondition:
      type: string
      x-extensible-enum:
        - ALWAYS
        - ONCE
        - NEVER
    RCConfigurationResponse:
      allOf:
        - $ref: "#/components/schemas/RCConfigurationPublic"
        - type: object
          properties:
            user_id:
              type: string
              minLength: 1
          required:
            - user_id
    ProblemJson:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |-
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          default: about:blank
          example: https://example.com/problem/constraint-violation
        title:
          type: string
          description: |-
            A short, summary of the problem type. Written in english and readable
            for engineers (usually not suited for non technical stakeholders and
            not localized); example: Service Unavailable
        status:
          type: integer
          format: int32
          description: >-
            The HTTP status code generated by the origin server for this
            occurrence of the problem.
          minimum: 100
          exclusiveMaximum: 600
          example: 200
        detail:
          type: string
          description: |-
            A human readable explanation specific to this occurrence of the
            problem.
          example: There was an error processing the request
        instance:
          type: string
          format: uri
          description: >-
            An absolute URI that identifies the specific occurrence of the
            problem.

            It may or may not yield further information if dereferenced.
    FiscalCode:
      type: string
      description: User's fiscal code.
      format: FiscalCode
      x-import: "@pagopa/ts-commons/lib/strings"
      example: SPNDNL80R13C555X
