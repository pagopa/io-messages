openapi: 3.0.3
info:
  title: IO Messages - RC App - Internal API
  version: 0.1.0
  description: Internal API for reading Remote Content configurations.

paths:
  /api/info:
    get:
      operationId: getInfo
      summary: Get application info.
      description: Returns the application name and current version.
      responses:
        "200":
          description: Application info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInfo"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/health:
    get:
      operationId: getHealthcheck
      summary: Check application health.
      description: >-
        Returns the health status of the application. A 200 response with a
        non-empty `failures` array means the app is running but one or more
        dependencies are unavailable.
      responses:
        "200":
          description: Health status of the application and its dependencies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthcheckOutput"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/internal/rc-configurations/{configurationId}:
    get:
      operationId: getRcConfiguration
      summary: Get a remote-content configuration by configurationId.
      description: >-
        Returns the remote-content configuration identified by the provided
        configurationId (ULID).
      parameters:
        - name: configurationId
          in: path
          required: true
          description: ULID identifier of the remote-content configuration.
          schema:
            $ref: "#/components/schemas/Ulid"
      responses:
        "200":
          description: The remote-content configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RCConfigurationResponse"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Configuration not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  schemas:
    AppInfo:
      type: object
      description: Application name and version.
      properties:
        name:
          type: string
          description: Application name.
          example: rc-app
        version:
          type: string
          description: Application version.
          example: 0.1.0
      required:
        - name
        - version

    HealthcheckOutput:
      type: object
      description: Health status of the application.
      properties:
        failures:
          type: array
          description: >-
            List of error messages from unhealthy dependencies. Empty when all
            dependencies are healthy.
          items:
            type: string
      required:
        - failures

    Ulid:
      type: string
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
    RCConfigurationPublic:
      allOf:
        - $ref: "#/components/schemas/RCConfigurationBase"
        - $ref: "#/components/schemas/RCConfigurationEnvironment"
    NewRCConfigurationBase:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Configuration name.
        description:
          type: string
          minLength: 1
          description: Configuration description.
        has_precondition:
          $ref: "#/components/schemas/HasPrecondition"
        disable_lollipop_for:
          type: array
          items:
            type: string
            description: User's fiscal code.
            format: FiscalCode
            x-import: "@pagopa/ts-commons/lib/strings"
            example: SPNDNL80R13C555X
        is_lollipop_enabled:
          type: boolean
          description: Flag to check if lollipop is enabled
      required:
        - name
        - description
        - has_precondition
        - disable_lollipop_for
        - is_lollipop_enabled
    RCConfigurationBase:
      allOf:
        - $ref: "#/components/schemas/NewRCConfigurationBase"
        - type: object
          properties:
            configuration_id:
              type: string
              description: Ulid string.
              format: Ulid
              x-import: "@pagopa/ts-commons/lib/strings"
              example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
          required:
            - configuration_id
    RCConfigurationEnvironment:
      type: object
      properties:
        test_environment:
          $ref: "#/components/schemas/RCConfigurationTestEnvironment"
        prod_environment:
          $ref: "#/components/schemas/RCConfigurationProdEnvironment"
    RCConfigurationProdEnvironment:
      type: object
      properties:
        base_url:
          type: string
          minLength: 1
          description: Base url of the server.
        details_authentication:
          $ref: "#/components/schemas/RCAuthenticationConfig"
      required:
        - base_url
        - details_authentication
    RCAuthenticationConfig:
      type: object
      properties:
        header_key_name:
          type: string
          minLength: 1
          description: header key name
        key:
          type: string
          minLength: 1
          description: authentication config key
        type:
          type: string
          minLength: 1
          description: authentication config type
        cert:
          $ref: "#/components/schemas/RCClientCert"
      required:
        - header_key_name
        - key
        - type
    RCClientCert:
      type: object
      properties:
        client_cert:
          type: string
          minLength: 1
          description: authentication config client cert
        client_key:
          type: string
          minLength: 1
          description: authentication config client key
        server_ca:
          type: string
          minLength: 1
          description: authentication config server ca
      required:
        - client_cert
        - client_key
        - server_ca
    RCConfigurationTestEnvironment:
      allOf:
        - $ref: "#/components/schemas/RCConfigurationProdEnvironment"
        - type: object
          properties:
            test_users:
              type: array
              items:
                $ref: "#/components/schemas/FiscalCode"
          required:
            - test_users
    RCConfigurationResponse:
      allOf:
        - $ref: "#/components/schemas/RCConfigurationPublic"
        - type: object
          properties:
            user_id:
              type: string
              minLength: 1
          required:
            - user_id
    HasPrecondition:
      type: string
      x-extensible-enum:
        - ALWAYS
        - ONCE
        - NEVER

    FiscalCode:
      type: string
      description: User's fiscal code.
      format: FiscalCode
      x-import: "@pagopa/ts-commons/lib/strings"
      example: SPNDNL80R13C555X

    ProblemDetails:
      type: object
      description: RFC 7807 problem details object.
      properties:
        type:
          type: string
          format: uri
          description: >-
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
          example: https://example.com/problem/constraint-violation
        title:
          type: string
          description: >-
            A short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: The HTTP status code.
          minimum: 100
          maximum: 599
          example: 404
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Configuration not found
        instance:
          type: string
          format: uri
          description: An absolute URI that identifies the specific occurrence of the problem.
