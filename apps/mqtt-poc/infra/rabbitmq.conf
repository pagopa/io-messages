listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/poc/ca.pem
ssl_options.certfile = /etc/rabbitmq/poc/broker.pem
ssl_options.keyfile = /etc/rabbitmq/poc/broker.key
ssl_options.verify = verify_none
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
mqtt.listeners.tcp = none
mqtt.listeners.ssl.default = 8883
mqtt.allow_anonymous = false
mqtt.disconnect_on_unauthorized = false
mqtt.vhost = io-mqtt-poc
mqtt.max_session_expiry_interval_seconds = 3600
mqtt.prefetch = 20
management.ssl.port = 15671
management.ssl.cacertfile = /etc/rabbitmq/poc/ca.pem
management.ssl.certfile = /etc/rabbitmq/poc/broker.pem
management.ssl.keyfile = /etc/rabbitmq/poc/broker.key
prometheus.tcp.port = 15692
auth_backends.1.authn = http
auth_backends.1.authz = internal
auth_http.http_method = post
auth_http.user_path = https://mqtt-onboarding:8444/auth/user
auth_http.request_timeout = 5000
auth_http.connection_timeout = 3000
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/poc/definitions.json
vm_memory_high_watermark.absolute = 768MiB
disk_free_limit.absolute = 1GB
