name: "io-com"

services:
  devcontainer:
    build: .devcontainer
    volumes:
      - ".:/workspace:cached"
      - "azure-functions-core-tools:/home/vscode/.azure-functions-core-tools"
    network_mode: "service:azurite"

  rc-app:
    build:
      context: .
      dockerfile: ./apps/rc-app/Dockerfile
    env_file: ./apps/rc-app/.env
    ports:
      - 3010:3000

  messages-app:
    build:
      context: .
      dockerfile: ./apps/messages-app/Dockerfile
    env_file: ./apps/messages-app/.env
    ports:
      - 3000:3000

  reminder:
    profiles: ["reminder"]
    build:
      context: ./apps/reminder
      dockerfile: Dockerfile
      platforms: ["linux/amd64"]
    platform: linux/amd64
    ports:
      - "127.0.0.1:${REMINDER_LOCAL_PORT:-9090}:9090"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: "-Dotel.javaagent.enabled=false -Duser.timezone=Europe/Rome"
      MONGO_DATABASE_URI: "mongodb://root:local@mongo:27017/reminder?authSource=admin"
      BOOTSTRAP_SERVER_REMINDER: "eventhubs:9092"
      BOOTSTRAP_SERVER_SHARED: "eventhubs:9092"
      KAFKA_URL_MESSAGE: &reminder-kafka-jaas >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="$$ConnectionString"
        password="Endpoint=sb://eventhubs;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;";
      KAFKA_URL_MESSAGESTATUS: *reminder-kafka-jaas
      KAFKA_URL_MESSAGESEND: *reminder-kafka-jaas
      KAFKA_URL_SHARED: *reminder-kafka-jaas
      IS_ACTIVE_MESSAGE_CONSUMER: "true"
      IS_ACTIVE_MESSAGESTATUS_CONSUMER: "false"
      IS_ACTIVE_PAYMENT_CONSUMER: "true"
      IS_ACTIVE_MESSAGESEND_CONSUMER: "true"
      ENABLE_QUARTZ: "true"
      SCHEDULER_REMINDER_NOTIFY_ACTIVE: "true"
      SCHEDULER_REMINDER_DELETE_ACTIVE: "false"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      eventhubs:
        condition: service_started
      mock-server-pagopa-ecommerce:
        condition: service_healthy
      mock-server-apim:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --output-document=/dev/null http://127.0.0.1:9090/health
          && wget --quiet --output-document=/dev/null http://eventhubs:5300/health
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  redis:
    image: "redis/redis-stack:6.2.6-v19@sha256:93b5454f383821d7279373ff97fcaa48960cc543c53afe1471e2e2a97efee6df"
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      REDIS_ARGS: "--requirepass local"

  azurite:
    image: "mcr.microsoft.com/azure-storage/azurite:latest@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37"
    command: "azurite --blobHost 0.0.0.0 --tableHost 0.0.0.0 --queueHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  azurite-setup:
    image: node:24-alpine@sha256:2bdb65ed1dab192432bc31c95f94155ca5ad7fc1392fb7eb7526ab682fa5bf14
    depends_on:
      - azurite
    working_dir: /app
    volumes:
      - ./setup-azurite-containers.js:/app/setup-azurite-containers.js
    command: sh -c "npm install @azure/storage-blob@^12.28.0 @azure/storage-queue@^12.28.1 @azure/data-tables@^13.3.2 && node setup-azurite-containers.js"

  cosmos:
    image: "mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest"
    environment:
      GATEWAY_PUBLIC_ENDPOINT: "cosmos"
    ports:
      - "8081:8081" # Gateway endpoint (HTTP).
      - "8080:8080" # Health probe endpoint.
      - "1234:1234" # Data Explorer UI.

  cosmos-setup:
    image: node:24-alpine@sha256:2bdb65ed1dab192432bc31c95f94155ca5ad7fc1392fb7eb7526ab682fa5bf14
    depends_on:
      - cosmos
    working_dir: /app
    volumes:
      - ./setup-cosmos-containers.js:/app/setup-cosmos-containers.js
    environment:
      COSMOSDB_URI: "http://cosmos:8081"
      COSMOSDB_KEY: "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="
      COSMOSDB_NAME: "io-messages"
      COSMOSDB_HEALTH_URL: "http://cosmos:8080/ready"
    command: sh -c "npm install @azure/cosmos@^4.9.0 && node setup-cosmos-containers.js"

  eventhubs:
    image: "mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest@sha256:25ec4141efb69933a0c82e6a787fa147a3895519e7d236d4c41ba568e03100eb"
    depends_on:
      - "azurite"
    ports:
      - "5672:5672"
      - "9092:9092"
      - "9093:9093"
    volumes:
      - "./eventhubs-emulator.json:/Eventhubs_Emulator/ConfigFiles/Config.json"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: Y

  kafka-ui:
    build:
      context: .
      dockerfile: ./kafka-ui/Dockerfile
    depends_on:
      - "eventhubs"
    ports:
      - "8002:8080"
    volumes:
      - "./apps/reminder/src/main/resources/avro/message.json:/etc/kafka-ui/schemas/reminder-message.json:ro"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "eventhubs:9092"
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: "PLAIN"
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="$$ConnectionString" password="Endpoint=sb://eventhubs;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;";'
      KAFKA_CLUSTERS_0_SERDE_0_NAME: "ReminderAvro"
      KAFKA_CLUSTERS_0_SERDE_0_CLASSNAME: "it.ioapp.com.local.ReminderAvroSerde"
      KAFKA_CLUSTERS_0_SERDE_0_FILEPATH: "/etc/kafka-ui/serdes/reminder-avro-serde.jar"
      KAFKA_CLUSTERS_0_SERDE_0_TOPICVALUESPATTERN: "^reminder-messages$"
      KAFKA_CLUSTERS_0_SERDE_0_PROPERTIES_SCHEMAFILE: "/etc/kafka-ui/schemas/reminder-message.json"

  mailhog:
    image: "mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea"
    ports:
      - "8025:8025"
      - "1025:1025"

  mock-server-session-manager:
    image: mockoon/cli:latest@sha256:80c4acd9517840b6574784d420de2dc97a8b750d21b6a4b573d042d21e4833ba
    command: ["--data", "data", "--port", "3000"]
    ports:
      - "8004:3000"
    volumes:
      - "./mockoon/session-manager.json:/data:readonly"

  mock-server-apim:
    image: mockoon/cli:latest@sha256:80c4acd9517840b6574784d420de2dc97a8b750d21b6a4b573d042d21e4833ba
    command: ["--data", "data", "--port", "3000"]
    ports:
      - "8007:3000"
    volumes:
      - "./mockoon/apim.json:/data:readonly"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/messages/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  mock-server-services-cms:
    image: mockoon/cli:latest@sha256:80c4acd9517840b6574784d420de2dc97a8b750d21b6a4b573d042d21e4833ba
    command: ["--data", "data", "--port", "3000"]
    ports:
      - "8009:3000"
    volumes:
      - "./mockoon/services-cms.json:/data:readonly"

  mock-server-pagopa-ecommerce:
    image: mockoon/cli:latest@sha256:80c4acd9517840b6574784d420de2dc97a8b750d21b6a4b573d042d21e4833ba
    command: ["--data", "data", "--port", "3000"]
    ports:
      - "8010:3000"
    environment:
      TZ: Europe/Rome
    volumes:
      - "./mockoon/pagopa-ecommerce.json:/data:readonly"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/payment-requests/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  mock-server-send:
    image: mockoon/cli:latest@sha256:80c4acd9517840b6574784d420de2dc97a8b750d21b6a4b573d042d21e4833ba
    command: ["--data", "data", "--port", "3000"]
    ports:
      - "8005:3000"
    volumes:
      - "./mockoon/send.json:/data:readonly"

  mock-server-send-lollipop-lambda:
    image: mockoon/cli:latest@sha256:80c4acd9517840b6574784d420de2dc97a8b750d21b6a4b573d042d21e4833ba
    command: ["--data", "data", "--port", "3000"]
    ports:
      - "8008:3000"
    volumes:
      - "./mockoon/lollipop-lambda.json:/data:readonly"

  mock-server-lollipop:
    image: mockoon/cli:latest@sha256:80c4acd9517840b6574784d420de2dc97a8b750d21b6a4b573d042d21e4833ba
    command: ["--data", "data", "--port", "3000"]
    ports:
      - "8006:3000"
    volumes:
      - "./mockoon/lollipop.json:/data:readonly"

  mock-server-remote-content:
    image: mockoon/cli:latest@sha256:80c4acd9517840b6574784d420de2dc97a8b750d21b6a4b573d042d21e4833ba
    command: ["--data", "data", "--port", "3000"]
    ports:
      - "8011:3000"
    volumes:
      - "./mockoon/remote-content.json:/data:readonly"

  mysql:
    image: "mysql:8.0.42@sha256:4890b3247d48a6dc1f3ac1e979330af4e543d06f194322f3879b27e6c7052585"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "local"
      MYSQL_DATABASE: "reminder"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql
          --host=127.0.0.1 --user=root --database="$$MYSQL_DATABASE" --execute="SELECT 1"
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  phpmyadmin:
    image: "phpmyadmin:5.2.2-apache@sha256:73467128842bc4406372310f068bc9ccb6727a82c7b5dc9c4f3d815ead33eab8"
    depends_on:
      - "mysql"
    ports:
      - "8003:80"
    environment:
      PMA_HOST: "mysql"
      PMA_USER: "root"
      PMA_PASSWORD: "local"

  mongo:
    image: mongo@sha256:98028cf281bb5d49ace5e1ddbd4509e8f1382fe80ef1cf101eeefdc106d76cd4
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: local
      MONGO_INITDB_DATABASE: "reminder"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'db.adminCommand({ ping: 1 })'
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  mongo-express:
    image: mongo-express@sha256:1b23d7976f0210dbec74045c209e52fbb26d29b2e873d6c6fa3d3f0ae32c2a64
    ports:
      - 8050:8081
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: local
      ME_CONFIG_BASICAUTH: false

volumes:
  azure-functions-core-tools:
